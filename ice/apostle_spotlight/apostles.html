<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
       #apostles{
        background: url(images/christus.webp);
        border: 5px solid black;
        width: 777px;
        height: 600px;
        margin: 0 auto;
        border-radius: 20px;
        background-size: cover;
        background-position-x: -178px;
        text-align: center;
       }
       body{
        background: #e8eced;
       }
       .firstp{
        width: 90px;
        height: 90px;
        border: 5px solid white;
        border-radius: 50%;
       }
       .pres{
        width: 110px;
        height: 110px;
        border: 5px solid white;
        border-radius: 50%;
       }
       .apostle{
        width: 70px;
        height: 70px;
        border: 5px solid white;
        border-radius: 50%;
        margin: 10px;
        margin-left: 30px;
        margin-right: 30px;
       }
       #doze{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin: 50px;
       }
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div id="apostles">
        <h1>First Presidency</h1>
    <img class="firstp" src="images/eyring.webp" alt="Henry B Eyring">
     <img class="pres" src="images/oaks.webp" alt="Dallin H Oaks">
     <img class="firstp" src="images/christofferson.webp" alt="D Todd Christofferson">
     <h3> Quorum of The Twelve Apostles</h3>
     <div id="doze">
         <img class="apostle" src="images/uchtdorf.webp" alt="Dieter F Uchtdorf">
         <img class="apostle" src="images/bednar.webp" alt="David A Bednar">
         <img class="apostle" src="images/cook.webp" alt="Quinton L Cook">
         <img class="apostle" src="images/anderson.webp" alt="Neil L Anderson">
         <img class="apostle" src="images/rasband.webp" alt="Ronald A Rasband">
         <img class="apostle" src="images/stevenson.webp" alt="Gary E Stevenson">
         <img class="apostle" src="images/renlund.webp" alt="Dale G Renlund">
         <img class="apostle" src="images/gong.webp" alt="Gerrit W Gong">
         <img class="apostle" src="images/soares.webp" alt="Ulysses Soares">
         <img class="apostle" src="images/kearon.webp" alt="Patrick Kearon">
         <img class="apostle" src="images/causse.webp" alt="Gerrad Causse">
         <img class="apostle" src="images/gilbert.webp" alt="some guy whos name I don't know Gilbert">
     </div>
     </div>
</body>
</html>
