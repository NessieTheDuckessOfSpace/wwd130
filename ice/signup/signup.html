<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer{
            border: 5px solid darkblue;
            margin-left: auto;
            margin-right: auto;
            margin-top: 50px;
            margin-bottom: 100px;
            height: 500px;
            width: 350px;
            background-color: white;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            border-radius: 25px;
        }
        form{
            font-family:Georgia, 'Times New Roman', Times, serif;
            grid-row: 3/4;
            grid-column: 1/3;
        }
        h3{
            grid-column: 1/3;
            grid-row: 2/3;
        }
        #headingFancy{
            background-image: url(images/jesus_feeds_5000.jpeg);
            width: 350px;
            height: 150px;
            background-size: cover;
            font-family: "Times New Roman", Georgia, Times, serif;
            color: white;
            grid-column: 1/3;
            grid-row: 1/2;
        }
        h1{
            margin-top: 50px;
            margin-left: 50px;
            margin-right: 50px;
        }
        #scriptures{
            grid-column: 1/3;
            grid-row: 4/5;
        }
        .scripture{
            width: 50px;
            height: 75px;
            padding: 3px;
            align-self: center;
            grid-row: 4/5;
        }
        #closeBtn{
            width: 21.33px;
            height: 24.9px;
            grid-row: 1/2;
            grid-column: 1/3;
            float: right;
            z-index: 1;
            margin: 10px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>
        <div id="headingFancy"><h1>Daily Feed Scripture A Day</h1></div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
         <div id="scriptures">
            <img src="images/old_testament.webp" class="scripture">
            <img src="images/new_testament.webp" class="scripture">
            <img src="images/book_of_mormon.webp" class="scripture">
            <img src="images/doctrine_and_covenants.webp" class="scripture">
            <img src="images/pearl_of_great_price.webp" class="scripture">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
